name: Marketplace public launch smoke test
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/marketplace-smoke.yml"
  workflow_dispatch:
jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production and check public pages
        run: |
          set -euo pipefail
          for path in / /sell /seller-terms /giveaway /sellers /shop /cart /checkout/success; do
            echo "Checking $path"
            status=""
            for attempt in $(seq 1 8); do
              status=$(curl --compressed -L -s -o /tmp/marketplace-check.html -w '%{http_code}' --max-time 25 "https://www.hometowncardshop.com$path" || true)
              if [ "$status" = "200" ]; then break; fi
              sleep 5
            done
            test "$status" = "200" || { echo "Unexpected status $status for $path"; exit 1; }
            echo "PASS $path HTTP $status"
          done
      - name: Public requests fail safely
        run: |
          set -euo pipefail
          giveaway=$(curl -s -o /tmp/giveaway.json -w '%{http_code}' --max-time 25 -X POST -H 'Content-Type: application/json' -d '{}' https://www.hometowncardshop.com/api/giveaway/enter)
          register=$(curl -s -o /tmp/register.json -w '%{http_code}' --max-time 25 -X POST -H 'Content-Type: application/json' -d '{}' https://www.hometowncardshop.com/api/seller/register)
          dealer=$(curl -s -o /tmp/dealer.json -w '%{http_code}' --max-time 25 -X POST -H 'Content-Type: application/json' -d '{}' https://www.hometowncardshop.com/api/dealer/checkout)
          echo "Giveaway invalid entry -> $giveaway"
          echo "Seller invalid registration -> $register"
          echo "Dealer payment disabled -> $dealer"
          test "$giveaway" = "400"
          test "$register" = "400"
          test "$dealer" = "503"
          connect=$(curl -s -o /tmp/connect.json -w '%{http_code}' --max-time 25 -X POST -H 'Content-Type: application/json' -d '{}' https://hometowncardshop.vercel.app/api/stripe/connect/webhook)
          echo "Connect unsigned event -> $connect"
          test "$connect" = "400"
          owner=$(curl -s -o /tmp/owner.json -w '%{http_code}' --max-time 25 https://www.hometowncardshop.com/api/portal/seller-applications)
          echo "Private seller applications -> $owner"
          test "$owner" = "401"
          confirmed=$(curl -s -o /tmp/confirmation.json -w '%{http_code}' --max-time 25 "https://www.hometowncardshop.com/api/orders/confirmation?session_id=cs_bad")
          echo "Invalid order confirmation reference -> $confirmed"
          test "$confirmed" = "400"
          ready=$(curl --fail-with-body -s --max-time 25 https://www.hometowncardshop.com/api/dealer/checkout)
          echo "Dealer checkout readiness -> $ready"
          echo "$ready" | grep -q '"available":false'

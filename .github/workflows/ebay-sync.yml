name: Sync connected eBay seller inventory
on:
  # Automatic 15-minute sync runs through protected Vercel Cron instead.
  # Leave GitHub manual dispatch available as emergency fallback only.
  workflow_dispatch:
jobs:
  ebay-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Poll connected eBay accounts safely
        env:
          HCS_EBAY_SYNC_SECRET: ${{ secrets.HCS_EBAY_SYNC_SECRET }}
        run: |
          if [ -z "$HCS_EBAY_SYNC_SECRET" ]; then
            echo "Manual fallback requires GitHub Actions secret HCS_EBAY_SYNC_SECRET. Automatic sync uses Vercel Cron."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 55 --retry 2 \
            -X POST "https://www.hometowncardshop.com/api/ebay-sync" \
            -H "Authorization: Bearer $HCS_EBAY_SYNC_SECRET" \
            -H "Content-Type: application/json" \
            --data '{}'

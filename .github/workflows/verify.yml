name: Verify card shop build
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc --noEmit --pretty false
      - name: Card pricing safeguards
        run: node scripts/test-card-pricing.mjs
      - name: Stripe Checkout expiration safeguards
        run: node scripts/test-stripe-checkout-timing.mjs
      - name: Optional eBay seller sync security safeguards
        run: node scripts/test-ebay-integration-guards.mjs
      - name: Card-only eBay category and reconciliation safeguards
        run: node scripts/test-ebay-card-only.mjs
      - name: Verify eBay ECDSA-SHA1 signature handling
        run: node scripts/test-ebay-signed-notification.mjs
      - name: Multi-seller card category and responsive nav checks
        run: node scripts/test-multiseller-categories.mjs
      - name: Verify independent-seller Connect checkout RPC wiring
        run: node scripts/test-dealer-checkout-rpc-allowlist.mjs
      - name: Verify Musial giveaway deadline and protected scheduled eBay sync
        run: node scripts/test-musial-giveaway-cron.mjs
      - name: Next.js build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://www.hometowncardshop.com
          NEXT_PUBLIC_STORE_LIVE: 'false'
          NEXT_PUBLIC_CHECKOUT_ENABLED: 'false'
      - name: Verify state-code sales tax and eBay deletion notification endpoint
        env:
          EBAY_DELETION_VERIFICATION_TOKEN: '0123456789abcdef0123456789abcdef0123456789abcdef'
        run: |
          npm run start -- -p 3195 > /tmp/hcs-server.log 2>&1 &
          echo $! > /tmp/hcs-server.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3195/ > /dev/null; then break; fi
            sleep 1
          done
          python3 scripts/test-tax-checkout-api.py || (cat /tmp/hcs-server.log && exit 1)
          node scripts/test-ebay-deletion-endpoint.mjs || (cat /tmp/hcs-server.log && exit 1)
          kill $(cat /tmp/hcs-server.pid) || true
